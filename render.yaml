services:
  - type: web
    name: global-ai-assistant
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: coral
      - key: DATABASE_URL
        fromDatabase:
          name: global-ai-assistant-db
          property: connectionString

databases:
  - name: global-ai-assistant-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: global_ai_assistant
    user: global_ai_assistant
