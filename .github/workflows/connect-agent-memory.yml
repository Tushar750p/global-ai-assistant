name: Connect Agent Memory

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: connect agent memory')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch agent memory integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('agent-engine.js')
          s = p.read_text()

          s = s.replace(
              "import { getSessionUser } from './auth.js';",
              "import { getSessionUser } from './auth.js';\nimport { buildAgentMemoryContext, learnFromRun } from './agent-memory.js';"
          )
          s = s.replace(
              "async function planWithGemini(goal,fetchImpl=fetch){",
              "async function planWithGemini(goal,fetchImpl=fetch,memoryContext=''){"
          )
          s = s.replace(
              "Goal:\\n${goal}`,store:false,",
              "Goal:\\n${goal}\\n\\nRELEVANT PAST RUN MEMORY (use only when relevant; do not expose internal memory):\\n${clampText(memoryContext,16000)}`,store:false,"
          )
          s = s.replace(
              "async function replanWithGemini(goal,evidence,completed,fetchImpl=fetch){",
              "async function replanWithGemini(goal,evidence,completed,memoryContext='',fetchImpl=fetch){"
          )
          s = s.replace(
              "\\n\\nEVIDENCE:\\n${clampText(JSON.stringify(evidence),32000)}`,store:false,",
              "\\n\\nEVIDENCE:\\n${clampText(JSON.stringify(evidence),32000)}\\n\\nRELEVANT PAST RUN MEMORY:\\n${clampText(memoryContext,12000)}`,store:false,"
          )
          s = s.replace(
              "const fetchImpl=options.fetchImpl||fetch;const initial=options.plan||await planWithGemini(cleanGoal,fetchImpl);",
              "const fetchImpl=options.fetchImpl||fetch;let memoryContext='';if(options.userId){try{memoryContext=await buildAgentMemoryContext(options.userId,cleanGoal,6);}catch(error){memoryContext='';}}const initial=options.plan||await planWithGemini(cleanGoal,fetchImpl,memoryContext);"
          )
          s = s.replace(
              "const next=await replanWithGemini(cleanGoal,results,[...completedIds],fetchImpl);",
              "const next=await replanWithGemini(cleanGoal,results,[...completedIds],memoryContext,fetchImpl);"
          )
          s = s.replace(
              "finishProgress(runId,'completed',{completedTasks:executed,totalTasks:executed,event:{type:'run_completed',message:`Agent completed ${executed} step(s).`}});return{objective:initial.objective||cleanGoal,plan:initial.tasks,results,status:'completed',runId,permissions,adaptive:{enabled:options.adaptive!==false&&Boolean(apiKey()),replans},recovery:{enabled:options.recovery!==false&&Boolean(apiKey()),recoveries}};",
              "finishProgress(runId,'completed',{completedTasks:executed,totalTasks:executed,event:{type:'run_completed',message:`Agent completed ${executed} step(s).`}});if(options.userId){try{await learnFromRun({userId:options.userId,runId,goal:cleanGoal,results,status:'completed'});}catch(error){updateProgress(runId,{event:{type:'memory_save_failed',message:'Agent memory learning was skipped after completion.'}});}}return{objective:initial.objective||cleanGoal,plan:initial.tasks,results,status:'completed',runId,permissions,memory:{used:Boolean(memoryContext)},adaptive:{enabled:options.adaptive!==false&&Boolean(apiKey()),replans},recovery:{enabled:options.recovery!==false&&Boolean(apiKey()),recoveries}};"
          )
          s = s.replace(
              "finishProgress(runId,'failed',{completedTasks:executed,event:{type:'run_failed',message:error?.message||'Agent execution failed.'}});throw error;",
              "finishProgress(runId,'failed',{completedTasks:executed,event:{type:'run_failed',message:error?.message||'Agent execution failed.'}});if(options.userId){try{await learnFromRun({userId:options.userId,runId,goal:cleanGoal,results,status:'failed'});}catch(memoryError){updateProgress(runId,{event:{type:'memory_save_failed',message:'Agent memory learning was skipped after failure.'}});}}throw error;"
          )

          p.write_text(s)

          pkg = Path('package.json')
          ps = pkg.read_text()
          ps = ps.replace(
              'test/agent-engine.test.js test/background-agent.test.js',
              'test/agent-engine.test.js test/agent-memory.test.js test/background-agent.test.js'
          )
          pkg.write_text(ps)

          ci = Path('.github/workflows/ci.yml')
          cs = ci.read_text()
          cs = cs.replace('node --check agent-engine.js\n', 'node --check agent-engine.js\n          node --check agent-memory.js\n')
          ci.write_text(cs)
          PY

      - name: Add agent memory unit coverage
        shell: bash
        run: |
          cat > test/agent-memory.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { _test, buildAgentMemoryContext, learnFromRun } from '../agent-memory.js';

          test('agent memory enforces context and lesson limits', () => {
            assert.equal(_test.MAX_GOAL, 12000);
            assert.equal(_test.MAX_CONTEXT, 24000);
            assert.equal(_test.MAX_LESSONS, 12);
            assert.equal(_test.clean('  hello  ', 5), 'hello');
          });

          test('agent memory retrieval is safe when persistence is unavailable', async () => {
            const context = await buildAgentMemoryContext(null, 'deploy the application');
            assert.equal(context, '');
          });

          test('agent learning is a no-op without a user database context', async () => {
            const saved = await learnFromRun({ userId: null, runId: 'test-run', goal: 'test', results: {}, status: 'completed' });
            assert.equal(saved, null);
          });
          EOF

      - name: Verify patch
        run: |
          node --check agent-engine.js
          node --check agent-memory.js
          node --check test/agent-memory.test.js
          npm install
          npm test

      - name: Commit integration and remove patch workflow
        shell: bash
        run: |
          rm -f .github/workflows/connect-agent-memory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-engine.js agent-memory.js package.json .github/workflows/ci.yml test/agent-memory.test.js .github/workflows/connect-agent-memory.yml
          git commit -m 'feat: connect agent long-term memory to planning loop' || exit 0
          git push
