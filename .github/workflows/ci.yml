name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: global_ai_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d global_ai_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/global_ai_assistant_test
      DATABASE_SSL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/usage-ui.js
          node --check public/billing-ui.js
          node --check public/research-ui.js
          node --check public/agent-ui.js
          node --check public/ui-enhancements.js
          node --check public/chat-polish.js
          node --check public/response-experience.js
          node --check public/premium-ui.js
          node --check public/advanced-workspace.js
          node --check public/task-dashboard.js
          node --check db.js
          node --check auth.js
          node --check agent-engine.js
          node --check agent-memory.js
          node --check background-agent.js
          node --check tool-execution.js

      - name: Run smoke test
        run: npm test

      - name: Run PostgreSQL integration test
        run: node --test test/db.integration.test.js
